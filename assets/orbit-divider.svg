<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="90" viewBox="0 0 1200 90" role="img" aria-label="Build, learn, and ship orbit divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.2" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="0.8" stop-color="#f0abfc"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="90" rx="18" fill="#020617"/>
  <path id="orbit" d="M40 45 C280 5 450 82 600 45 C750 8 920 82 1160 45" fill="none" stroke="url(#line)" stroke-width="2" stroke-dasharray="7 10">
    <animate attributeName="stroke-dashoffset" from="0" to="-34" dur="4s" repeatCount="indefinite"/>
  </path>
  <circle r="5" fill="#f0abfc" filter="url(#glow)"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion></circle>
  <text x="600" y="51" text-anchor="middle" fill="#e2e8f0" font-family="Bahnschrift, Trebuchet MS, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" font-stretch="semi-condensed" letter-spacing="8">BUILD  /  LEARN  /  SHIP</text>
</svg>
